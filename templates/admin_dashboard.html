<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='app.css') }}">
   
</head>
<body>
    <div class="container">
        <h1>Admin Dashboard</h1>
        <button class="logout-btn" onclick="logout()">LOGOUT</button>
        
        <div class="room-management">
            <h2>Room Management</h2>
            <div>
                <input type="text" id="room-code" placeholder="Enter room code">
                <button onclick="createRoom()">Create New Room</button>
            </div>
            
            <h3>Active Rooms</h3>
            <ul class="room-list" id="room-list">
                {% for room in rooms %}
                    <li>
                        <span>{{ room.room_code }} (Created: {{ room.created_at.strftime('%Y-%m-%d %H:%M') }})</span>
                        <div class="room-buttons">
                            <button onclick="selectRoom('{{ room.room_code }}')">View Members</button>
                            <button onclick="manageRoomMembers('{{ room.room_code }}')">Manage Members</button>
                            <button onclick="downloadAttendance('{{ room.room_code }}')">Download Attendance</button>
                            <button class="danger" onclick="closeRoom('{{ room.room_code }}')">Close Room</button>
                        </div>
                    </li>
                {% endfor %}
            </ul>
        </div>
        
        <div class="room-view" id="room-view" style="display:none;">
            <h2>Room: <span id="current-room-code"></span></h2>
            
            <div class="stats-panel" id="stats-panel">
                <div class="stat-card">
                    <h3>Total Members</h3>
                    <div class="count" id="total-count">0</div>
                </div>
                <div class="stat-card">
                    <h3>Present</h3>
                    <div class="count" id="present-count">0</div>
                </div>
                <div class="stat-card">
                    <h3>On Duty (OD)</h3>
                    <div class="count" id="od-count">0</div>
                </div>
                <div class="stat-card">
                    <h3>Excused</h3>
                    <div class="count" id="excused-count">0</div>
                </div>
            </div>
            
            <div class="room-tabs">
                <div class="tab-buttons">
                    <button class="tab-button active" onclick="showTab('all-members')">All Members</button>
                    <button class="tab-button" onclick="showTab('present-members')">Present</button>
                    <button class="tab-button" onclick="showTab('od-members')">On Duty</button>
                    <button class="tab-button" onclick="showTab('excused-members')">Excused</button>
                    <button class="tab-button" onclick="showTab('not-present-members')">Absent</button>
                </div>
                
                <div class="tab-content active" id="all-members">
                    <div class="members-grid" id="all-members-grid"></div>
                </div>
                
                <div class="tab-content" id="present-members">
                    <div class="members-grid" id="present-members-grid"></div>
                </div>
                
                <div class="tab-content" id="od-members">
                    <div class="members-grid" id="od-members-grid"></div>
                </div>
                
                <div class="tab-content" id="excused-members">
                    <div class="members-grid" id="excused-members-grid"></div>
                </div>
                
                <div class="tab-content" id="not-present-members">
                    <div class="members-grid" id="not-present-members-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let currentRoomCode = '';
        let memberData = [];
        
        // On page load
        window.onload = function() {
            checkAuth();
        };
        
        // Timer to refresh data
        setInterval(function() {
            if (currentRoomCode) {
                loadRoomMembers(currentRoomCode);
            }
        }, 10000); // Refresh every 10 seconds
        
        // Check if admin is authenticated
        function checkAuth() {
            // Check if session is valid
            fetch('/admin_dashboard')
                .then(response => {
                    if (!response.ok && response.redirected) {
                        window.location.href = '/login_admin';
                    }
                });
        }
        
        // Create a new room
        function createRoom() {
            const roomCode = document.getElementById('room-code').value;
            if (!roomCode) {
                alert('Please enter a room code');
                return;
            }
            
            const formData = new FormData();
            formData.append('room_code', roomCode);
            
            fetch('/create_room', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(data.message);
                    window.location.reload();
                } else {
                    alert(data.message);
                }
            });
        }
        
        // Select a room to view members
        function selectRoom(roomCode) {
            currentRoomCode = roomCode;
            document.getElementById('current-room-code').textContent = roomCode;
            document.getElementById('room-view').style.display = 'block';
            
            // Load room members
            loadRoomMembers(roomCode);
        }
        
        // Manage room members (redirect to member management page)
        function manageRoomMembers(roomCode) {
            window.location.href = `/add_room_members/${roomCode}`;
        }
        
        // Download attendance record
        function downloadAttendance(roomCode) {
            window.location.href = `/download_attendance/${roomCode}`;
        }
        
        // Close a room
        function closeRoom(roomCode) {
            if (confirm(`Are you sure you want to close room ${roomCode}? This action cannot be undone.`)) {
                fetch(`/close_room/${roomCode}`, {
                    method: 'POST'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert(data.message);
                        window.location.reload();
                    } else {
                        alert(data.message);
                    }
                });
            }
        }
        
        // Load room members
        function loadRoomMembers(roomCode) {
            fetch(`/room_members/${roomCode}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        memberData = data.members;
                        
                        // Update statistics
                        document.getElementById('total-count').textContent = data.stats.total;
                        document.getElementById('present-count').textContent = data.stats.present;
                        document.getElementById('od-count').textContent = data.stats.od;
                        document.getElementById('excused-count').textContent = data.stats.excused;
                        
                        // Clear all grids
                        document.getElementById('all-members-grid').innerHTML = '';
                        document.getElementById('present-members-grid').innerHTML = '';
                        document.getElementById('od-members-grid').innerHTML = '';
                        document.getElementById('excused-members-grid').innerHTML = '';
                        document.getElementById('not-present-members-grid').innerHTML = '';
                        
                        // Populate member grids
                        data.members.forEach(member => {
                            // Add to all members grid
                            document.getElementById('all-members-grid').appendChild(createMemberCard(member));
                            
                            // Add to appropriate status grid
                            if (member.status === 'Present') {
                                document.getElementById('present-members-grid').appendChild(createMemberCard(member));
                            } else if (member.status === 'OD') {
                                document.getElementById('od-members-grid').appendChild(createMemberCard(member));
                            } else if (member.status === 'Excused') {
                                document.getElementById('excused-members-grid').appendChild(createMemberCard(member));
                            } else { // Not Present
                                document.getElementById('not-present-members-grid').appendChild(createMemberCard(member));
                            }
                        });
                    } else {
                        alert(data.message);
                    }
                });
        }
        
        // Create member card for display
        function createMemberCard(member) {
            const card = document.createElement('div');
            card.className = 'member-card';
            
            // Create active indicator if present
            if (member.status === 'Present') {
                const activeIndicator = document.createElement('div');
                activeIndicator.className = `active-indicator ${member.active_status === 'Active' ? 'active-on' : 'active-off'}`;
                card.appendChild(activeIndicator);
            }
            
            // Add member info
            const memberInfo = document.createElement('div');
            memberInfo.className = 'member-info';
            
            const nameHeader = document.createElement('h3');
            nameHeader.textContent = member.username;
            memberInfo.appendChild(nameHeader);
            
            const rollNumber = document.createElement('p');
            rollNumber.textContent = `Roll Number: ${member.roll_number}`;
            memberInfo.appendChild(rollNumber);
            
            if (member.status === 'Present' && member.active_status !== 'N/A') {
                const activeStatus = document.createElement('p');
                activeStatus.textContent = `Status: ${member.active_status}`;
                memberInfo.appendChild(activeStatus);
                
                const activeTime = document.createElement('p');
                activeTime.textContent = `Active Time: ${member.active_time}`;
                memberInfo.appendChild(activeTime);
            }
            
            card.appendChild(memberInfo);
            
            // Add status label
            const statusLabel = document.createElement('div');
            statusLabel.className = `status-label status-${member.status.toLowerCase().replace(' ', '-')}`;
            statusLabel.textContent = member.status;
            card.appendChild(statusLabel);
            
            // Add actions
            const actions = document.createElement('div');
            actions.className = 'student-actions';
            
            const statusSelect = document.createElement('select');
            
            const notPresentOption = document.createElement('option');
            notPresentOption.value = 'Not Present';
            notPresentOption.textContent = 'Not Present';
            notPresentOption.selected = member.status === 'Not Present';
            statusSelect.appendChild(notPresentOption);
            
            const presentOption = document.createElement('option');
            presentOption.value = 'Present';
            presentOption.textContent = 'Present';
            presentOption.selected = member.status === 'Present';
            statusSelect.appendChild(presentOption);
            
            const odOption = document.createElement('option');
            odOption.value = 'OD';
            odOption.textContent = 'On Duty';
            odOption.selected = member.status === 'OD';
            statusSelect.appendChild(odOption);
            
            const excusedOption = document.createElement('option');
            excusedOption.value = 'Excused';
            excusedOption.textContent = 'Excused';
            excusedOption.selected = member.status === 'Excused';
            statusSelect.appendChild(excusedOption);
            
            actions.appendChild(statusSelect);
            
            const updateButton = document.createElement('button');
            updateButton.textContent = 'Update Status';
            updateButton.onclick = function() {
                updateStudentStatus(member.roll_number, currentRoomCode, statusSelect.value);
            };
            actions.appendChild(updateButton);
            
            card.appendChild(actions);
            
            return card;
        }
        
        // Update student status
        function updateStudentStatus(rollNumber, roomCode, status) {
            const formData = new FormData();
            formData.append('roll_number', rollNumber);
            formData.append('room_code', roomCode);
            formData.append('status', status);
            
            fetch('/update_student_status', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Reload room members
                    loadRoomMembers(roomCode);
                } else {
                    alert(data.message);
                }
            });
        }
        
        // Show tab content
        function showTab(tabId) {
            // Hide all tab content
            const tabContents = document.querySelectorAll('.tab-content');
            tabContents.forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Remove active class from all buttons
            const tabButtons = document.querySelectorAll('.tab-button');
            tabButtons.forEach(button => {
                button.classList.remove('active');
            });
            
            // Show selected tab content
            document.getElementById(tabId).classList.add('active');
            
            // Add active class to selected button
            event.target.classList.add('active');
        }
        
        // Logout function
        function logout() {
            fetch('/logout', {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = data.redirect;
                }
            });
        }
    </script>
</body>
</html>
